name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # diperlukan hanya untuk membuat Release saat push tag

env:
  AML_REPO: https://github.com/RusJJ/AndroidModLoader.git
  AML_REF: ""        # kosong = branch default; isi tag/commit untuk mengunci versi header
  LIB_NAME: libImprovedVehicleMobile.so

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil header AML (AndroidModLoader)
        run: |
          git clone --depth 1 ${AML_REF:+--branch "$AML_REF"} "$AML_REPO" /tmp/aml
          hdr="$(find /tmp/aml -name amlmod.h | head -n1)"
          if [ -z "$hdr" ]; then echo "amlmod.h tidak ditemukan di repo AML"; exit 1; fi
          echo "Header AML: $hdr"
          mkdir -p include/mod
          cp -r "$(dirname "$hdr")"/. include/mod/
          if [ ! -f include/mod/config.cpp ]; then echo "config.cpp tidak ada di $(dirname "$hdr")"; ls include/mod; exit 1; fi

      - name: Siapkan NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -x "$NDK/ndk-build" ]; then echo "NDK tidak ditemukan di runner"; exit 1; fi
          echo "NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "Memakai NDK: $NDK"

      - name: Build (ndk-build, arm64-v8a)
        run: |
          "$NDK_DIR/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j"$(nproc)"
          ls -l "libs/arm64-v8a/$LIB_NAME"

      - name: Periksa simbol yang diekspor (AML butuh OnModLoad dan __GetModInfo)
        run: |
          NM="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "libs/arm64-v8a/$LIB_NAME" | tee /tmp/exports.txt
          grep -q " OnModLoad" /tmp/exports.txt || { echo "OnModLoad TIDAK diekspor -> AML tidak akan memuat plugin"; exit 1; }
          grep -q " __GetModInfo" /tmp/exports.txt || { echo "__GetModInfo TIDAK diekspor -> AML tidak akan memuat plugin"; exit 1; }

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: ImprovedVehicleMobile-arm64-v8a
          path: libs/arm64-v8a/${{ env.LIB_NAME }}
          if-no-files-found: error

      - name: Buat Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: libs/arm64-v8a/${{ env.LIB_NAME }}
